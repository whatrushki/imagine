name: Build, Sign and Publish Multiplatform Release (APK, AAB, EXE)

on:
  release:
    types: [published, created]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. 1.1.0)'
        required: false
        default: '1.1.0'

env:
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
  RELEASE_SIGN_KEY_ALIAS: ${{ secrets.RELEASE_SIGN_KEY_ALIAS }}
  RELEASE_SIGN_KEY_PASSWORD: ${{ secrets.RELEASE_SIGN_KEY_PASSWORD }}

permissions:
  contents: write

jobs:
  build-exe:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install packaging tools
        run: npm i -D electron electron-builder

      - name: Build Web app
        run: npm run build

      - name: Build Windows Installer (.exe)
        run: npx electron-builder --win --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename EXE output
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "dist-electron\*.exe" -Exclude "*blockmap*" | Select-Object -First 1
          if ($installer) {
            Copy-Item $installer.FullName -Destination "dist-electron\Imagine-Setup.exe"
            Write-Host "Prepared: Imagine-Setup.exe"
          } else {
            Write-Error "Installer exe was not found"
          }

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist-electron/Imagine-Setup.exe
          if-no-files-found: error

  build-apk:
    name: Build & Sign Android Target (APK & AAB)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: Checkout Keystore Repository
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.KEYSTORE_GIT_REPOSITORY }}
          token: ${{ secrets.KEYSTORE_ACCESS_TOKEN }}
          path: keystore

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Capacitor CLI & Android
        run: npm i -D @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Web app
        run: npm run build

      - name: Initialize and Sync Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Android Targets via Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --stacktrace || ./gradlew assembleDebug --stacktrace

      - name: Sign Android APK and Prepare Outputs
        run: |
          mkdir -p output-android
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Using Android Build Tools: $BUILD_TOOLS_DIR"

          # Locate built unsigned or signed APK
          RAW_APK=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          RAW_AAB=$(find android/app/build/outputs/bundle -name "*.aab" | head -n 1 || true)

          echo "Found raw APK: $RAW_APK"

          # Check for custom keystore
          KEYSTORE_FILE=$(find keystore -name "*.jks" -o -name "*.keystore" 2>/dev/null | head -n 1 || true)

          if [ -n "$KEYSTORE_FILE" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "Signing with repository keystore: $KEYSTORE_FILE (alias: $RELEASE_SIGN_KEY_ALIAS)"
            $BUILD_TOOLS_DIR/zipalign -v -p 4 "$RAW_APK" output-android/aligned.apk
            $BUILD_TOOLS_DIR/apksigner sign \
              --ks "$KEYSTORE_FILE" \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --ks-key-alias "$RELEASE_SIGN_KEY_ALIAS" \
              --key-pass "pass:${RELEASE_SIGN_KEY_PASSWORD:-$KEYSTORE_PASSWORD}" \
              --out output-android/Imagine.apk \
              output-android/aligned.apk
          else
            echo "No custom keystore secret found, generating self-signed release key for valid APK signature..."
            keytool -genkey -v -keystore output-android/release.keystore \
              -alias imagine -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass imagine123 -keypass imagine123 \
              -dname "CN=Imagine, OU=What, O=What, L=City, S=State, C=RU"

            $BUILD_TOOLS_DIR/zipalign -v -p 4 "$RAW_APK" output-android/aligned.apk || cp "$RAW_APK" output-android/aligned.apk
            $BUILD_TOOLS_DIR/apksigner sign \
              --ks output-android/release.keystore \
              --ks-pass "pass:imagine123" \
              --ks-key-alias imagine \
              --key-pass "pass:imagine123" \
              --out output-android/Imagine.apk \
              output-android/aligned.apk
          fi

          # Verify signature
          $BUILD_TOOLS_DIR/apksigner verify --verbose output-android/Imagine.apk

          # Copy bundle if present
          if [ -n "$RAW_AAB" ] && [ -f "$RAW_AAB" ]; then
            cp "$RAW_AAB" output-android/Imagine.aab
          fi

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: output-android/Imagine.apk
          if-no-files-found: error

      - name: Upload Android AAB Artifact
        if: hashFiles('output-android/Imagine.aab') != ''
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: output-android/Imagine.aab

  publish-release:
    name: Attach Assets to GitHub Release
    needs: [build-exe, build-apk]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows Installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release-assets

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-assets

      - name: Download Android AAB
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: android-aab
          path: release-assets

      - name: Determine Release Tag
        id: release_info
        run: |
          TAG="${{ github.event.release.tag_name || github.ref_name || github.event.inputs.version || 'v1.0.3' }}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Attach Assets to Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: Imagine ${{ steps.release_info.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
